/* Boardroom Earnings tokens — sole theme (no alternate presets). */
:root {
  --font-display: "Source Sans 3", sans-serif;
  --font-body: "Source Sans 3", sans-serif;
  --font-sans: "Source Sans 3", "IBM Plex Sans", sans-serif;
  --font-num: "IBM Plex Sans", "Source Sans 3", sans-serif;

  --stage-bg: #0b0f1a;
  --slide-bg: #ffffff;
  --bg: #ffffff;
  --bg-soft: #f8f8f8;
  --panel: #eef0f0;
  --panel-border: #d8dce3;

  --navy: #00175a;
  --navy-deep: #001058;
  --navy-mid: #002060;
  --blue: #006fcf;
  --blue-sky: #80c8ff;
  --ink: #53565a;
  --ink-muted: #63666a;
  --ink-faint: #929292;
  --ink-on-navy: #ffffff;
  --grid: #e0e4ea;
  --rule: #00175a;
  --negative: #53565a;

  --accent: var(--blue);
  --accent-2: var(--navy);
  --callout-bg: rgba(0, 23, 90, 0.05);

  --fs-display: 72px;
  --fs-title: 56px;
  --fs-h1: var(--fs-title);
  --fs-cover: var(--fs-display);
  --fs-insight: 26px;
  --fs-sub: 22px;
  --fs-lead: 22px;
  --fs-body: 22px;
  --fs-kpi: 70px;
  --fs-kpi-label: 24px;
  --fs-meta: 14px;
  --fs-foot: 14px;
  --fs-bridge: 18px;
 --fs-pill: 28px; /* F4+: pill statement board type scale (PDF p3: 14pt ≈ 28px) */

  --pad-x: 96px;
  --pad-top: 56px;
  --pad-bottom: 48px;
  --gap-lg: 32px;
  --gap-md: 18px;
  --gap-sm: 12px;
  --gap-section: 32px;
  --gap-content: 20px;
  --gap-row: 14px;
  --gap-tight: 10px;
  /* Breathing room under the title/dek block before body content starts.
     Per-layout overrides set --gap-header-main on .layout-* (option C). */
  --gap-header-main: 45px;
  /* Vertical rhythm for multi-item carriers (quote stack, process rail).
     Pack-from-top still wins for short 1–2 item lists — do NOT space-between those. */
  --gap-stack: 48px;
  --gap-stack-loose: 64px;
  /* Option B: min-height on multi-item (>=3) hero carriers only */
  --hero-band-min: 560px;

  --card-radius: 16px;
  --radius-panel: 20px;
  --radius-header: 14px;
  --radius-card: 14px;

  /* ------------------------------------------------------------------ */
  /* Open Props-style scales                                            */
  /* ------------------------------------------------------------------ */

  /* Size scale */
  --size-1: 4px;
  --size-2: 8px;
  --size-3: 12px;
  --size-4: 16px;
  --size-5: 20px;
  --size-6: 24px;
  --size-7: 28px;
  --size-8: 32px;
  --size-9: 36px;
  --size-10: 40px;
  --size-11: 48px;
  --size-12: 56px;
  --size-13: 64px;
  --size-14: 80px;
  --size-15: 96px;

  /* Radius scale */
  --radius-1: 4px;
  --radius-2: 8px;
  --radius-3: 12px;
  --radius-4: 14px;
  --radius-5: 16px;
  --radius-6: 20px;
  --radius-round: 50%;

  /* Shadow system */
  --shadow-color: 11, 15, 26;
  --shadow-strength: 0.08;
  --shadow-1: 0 1px 2px rgba(var(--shadow-color), calc(var(--shadow-strength) + 0.02));
  --shadow-2: 0 2px 8px rgba(var(--shadow-color), var(--shadow-strength));
  --shadow-3: 0 4px 16px rgba(var(--shadow-color), calc(var(--shadow-strength) + 0.04));
  --shadow-4: 0 8px 24px rgba(var(--shadow-color), calc(var(--shadow-strength) + 0.06));
  --shadow-5: 0 12px 32px rgba(var(--shadow-color), calc(var(--shadow-strength) + 0.08));
  --shadow-6: 0 16px 48px rgba(var(--shadow-color), calc(var(--shadow-strength) + 0.10));

  /* Gradient tokens (subtle, Boardroom-tinted) */
  --gradient-surface: linear-gradient(180deg, #ffffff 0%, #f8f8f8 100%);
  --gradient-panel: linear-gradient(180deg, var(--panel) 0%, rgba(0, 23, 90, 0.03) 100%);
  --gradient-accent-soft: linear-gradient(135deg, rgba(0, 111, 207, 0.04) 0%, rgba(0, 23, 90, 0.06) 100%);
}


/* Semantic design tokens — theme-agnostic layer mapping to boardroom tokens.
   Override these at :root to inject a new brand without touching layout CSS. */
:root {
  /* Typography */
  --font-display: var(--font-body, "Source Sans 3", sans-serif);
  --font-body: "Source Sans 3", "IBM Plex Sans", sans-serif;
  --font-sans: var(--font-body);
  --font-num: "IBM Plex Sans", "Source Sans 3", sans-serif;
  --font-mono: "IBM Plex Mono", monospace;

  /* Color palette — semantic names */
  --color-primary: var(--navy, #00175a);
  --color-primary-deep: var(--navy-deep, #001058);
  --color-primary-mid: var(--navy-mid, #002060);
  --color-accent: var(--blue, #006fcf);
  --color-accent-light: var(--blue-sky, #80c8ff);
  --color-accent-2: #0a7d55;          /* success / positive — new semantic */
  --color-warn: #b35900;             /* warning — new semantic */
  --color-ink: var(--ink, #53565a);
  --color-ink-soft: var(--ink-faint, #929292);
  --color-ink-muted: var(--ink-muted, #63666a);
  --color-ink-faint: var(--ink-faint, #929292);
  --color-ink-on-primary: var(--ink-on-navy, #ffffff);
  --color-surface: var(--slide-bg, #ffffff);
  --color-surface-soft: var(--bg-soft, #f8f8f8);
  --color-surface-alt: var(--bg-soft, #f8fafc);
  --color-panel: var(--panel, #eef0f0);
  --color-panel-border: var(--panel-border, #d8dce3);
  --color-border: var(--panel-border, #e5e7eb);
  --color-grid: var(--grid, #e0e4ea);
  --color-rule: var(--rule, #00175a);
  --color-negative: var(--negative, #53565a);

  /* Spacing scale — mapped to size tokens */
  --space-xs: var(--size-2, 8px);
  --space-sm: var(--size-3, 12px);
  --space-md: var(--size-5, 20px);
  --space-lg: var(--size-7, 28px);
  --space-xl: var(--size-8, 32px);
  --space-2xl: var(--size-11, 48px);
  --space-3xl: var(--size-15, 96px);

  /* Border radius — mapped to radius scale */
  --radius-sm: var(--radius-2, 8px);
  --radius-md: var(--radius-4, 14px);
  --radius-lg: var(--radius-6, 20px);
  --radius-card: var(--radius-5, 16px);

  /* Shadows — mapped to shadow scale */
  --shadow-sm: var(--shadow-1);
  --shadow-md: var(--shadow-2);
  --shadow-lg: var(--shadow-3);

  /* Grid gaps */
  --grid-gap-sm: var(--space-sm, 12px);
  --grid-gap-md: var(--space-md, 18px);
  --grid-gap-lg: var(--space-lg, 32px);

  /* Stage */
  --slide-padding: var(--pad-x, 96px);

  /* Typography scale */
  --text-xs: var(--fs-meta, 14px);
  --text-sm: var(--fs-foot, 14px);
  --text-base: var(--fs-body, 22px);
  --text-lg: var(--fs-lead, 22px);
  --text-xl: var(--fs-insight, 26px);
  --text-2xl: var(--fs-sub, 22px);
  --text-display: var(--fs-display, 72px);
  --text-title: var(--fs-title, 56px);
}


/* Fixed 1920×1080 stage + deck nav shell. */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  width: 100%; height: 100%; margin: 0; overflow: hidden;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--stage-bg);
}

.deck-viewport {
  position: fixed; inset: 0; overflow: hidden;
  background: var(--stage-bg);
}

.deck-stage {
  width: 1920px; height: 1080px;
  position: absolute; left: 0; top: 0;
  overflow: hidden;
  transform-origin: 0 0;
  background: var(--slide-bg);
}

.slide {
  position: absolute; inset: 0;
  display: none; visibility: hidden; opacity: 0;
  background: var(--slide-bg);
  color: var(--ink);
  overflow: hidden;
}
.slide.active {
  display: block; visibility: visible; opacity: 1;
}

.slide-number {
  position: absolute; right: 48px; bottom: 28px;
  font-family: var(--font-num);
  font-size: var(--fs-meta);
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  z-index: 5;
}

.deck-controls {
  position: fixed; right: 24px; bottom: 24px; z-index: 1000;
  display: flex; gap: 8px;
}
.deck-controls button {
  border: 0; border-radius: 8px;
  background: rgba(255,255,255,0.12);
  color: #fff; font: 600 14px var(--font-body);
  padding: 10px 14px; cursor: pointer;
}
.deck-controls button:hover { background: rgba(255,255,255,0.2); }

/* Speaker notes overlay (hidden until body.show-notes) */
.speaker-notes {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0;
  max-height: 42vh; overflow: auto; z-index: 999;
  background: rgba(11, 15, 26, 0.94); color: #e8ecf2;
  padding: 20px 32px 28px;
  font: 400 16px/1.45 var(--font-body);
}
body.show-notes .slide.active .speaker-notes { display: block; }
.speaker-notes .visually-hidden {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); border: 0;
}

/* Face bridges are banned under Boardroom notes-only policy */
.narrative-bridge, .story-bridge { display: none !important; }


/* ============================================================
   Grid Design System — gl-* primitives
   All layout recipes compose from these; do not invent orphan grids.
   ============================================================ */

/* Slide frame: header / main / footer named areas */
.gl-slide {
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    "header"
    "main"
    "footer";
  height: 100%;
  width: 100%;
  padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
  box-sizing: border-box;
  align-content: start;
}
.gl-header {
  grid-area: header;
  min-width: 0;
  /* Title+dek cluster: separate from body without stretching the body */
  margin-bottom: var(--gap-header-main);
  padding-bottom: 0;
}
.gl-main   {
  grid-area: main;
  min-width: 0;
  min-height: 0;
  /* pack-from-top: free canvas stays BELOW content, not between sparse list rows */
  align-content: start;
  align-self: stretch;
}
.gl-footer { grid-area: footer; min-width: 0; margin-top: var(--gap-md); }

/* ============================================================
   Option C — per-layout header→main gap
   Default --gap-header-main is 45px; denser content layouts use less,
   quote/voice and comparison use more air under the dek.
   ============================================================ */
.layout-quote_card            { --gap-header-main: 52px; }
.layout-comparison_grid       { --gap-header-main: 48px; }
.layout-metric_dashboard,
.layout-metric.dense-2x2,
.gl-slide.layout-metric_dashboard { --gap-header-main: 40px; }
.layout-data_table            { --gap-header-main: 40px; }
.layout-timeline,
.layout-roadmap,
.layout-full_process_flow     { --gap-header-main: 42px; }
.layout-split_text_visual     { --gap-header-main: 36px; }
.layout-grouped_bar_chart,
.layout-stacked_bar_chart,
.layout-waterfall_chart,
.layout-heatmap,
.layout-icon_grid             { --gap-header-main: 40px; }
.layout-freeform_grid         { --gap-header-main: 40px; }

/* ============================================================
   Option B — hero band only when multi-item (>=3)
   section.gl-density-hero is set by slide_shell(item_count>=3).
   Claims mid-canvas via min-height on the carrier — NOT flex-grow
   on short 1–2 item lists (those have no gl-density-hero).
   ============================================================ */
/* Hero min-height applies to tall multi-item carriers that FILL their own box
   (quote stack, KPI 2x2, VERTICAL timeline, comparison, split, chart).

   DO NOT apply to process-flow--horizontal: the 3 platform cards are a short
   single row, and the closed-loop outcome bar is a SIBLING after that row.
   Forcing min-height on the row alone opens a dead band between cards and
   the outcome (S3 closed-loop screenshot bug). Horizontal process packs from
   the top; vertical timelines still get the hero band. */
.slide.gl-density-hero .gl-main > .gl-areas-quote-stack,
.slide.gl-density-hero .gl-main > .quote-layout--stack,
.slide.gl-density-hero .gl-main > .gl-areas-metric,
.slide.gl-density-hero .gl-main > .process-flow--vertical,
.slide.gl-density-hero .gl-main > .comparison-grid,
.slide.gl-density-hero .gl-main > .gl-areas-split,
.slide.gl-density-hero .gl-main > .chart-frame,
/* Wave-layout carriers: plain .gl-grid / diagram scenes direct in gl-main.
   Enrolled in the hero band so evidence/source/comparison/priority/trend
   card grids and SVG diagram scenes claim mid-canvas instead of packing
   into a thin top strip. */
.slide.gl-density-hero .gl-main > .gl-grid,
.slide.gl-density-hero .gl-main > .gl-areas-diagram,
.slide.gl-density-hero .gl-main > .layout-insight-evidence {
  min-height: var(--hero-band-min);
}
/* Card grids stretch their rows to fill the hero band so cards become
   tall panels (not thin strips). Only auto-row grids: the metric 2x2 and
   process flows have their own packing rules elsewhere.
   EXCLUDE gl-grid-auto (horizontal process) — that packs from top. */
.slide.gl-density-hero .gl-main > .gl-grid:not(.gl-grid-auto) {
  align-content: stretch;
  grid-auto-rows: 1fr;
}
/* horizontal process: never hero min-height — keep content-height */
.slide.gl-density-hero .gl-main > .process-flow--horizontal,
.slide.gl-density-hero .gl-main > .gl-areas-process-h {
  min-height: 0 !important;
  align-content: start;
  align-items: start;
}
/* outcome bar sits right under the platform row (tight, not mid-canvas) */
.gl-main > .process-flow--horizontal + .process-outcome,
.gl-main > .process-flow--horizontal + .gl-process-outcome,
.gl-main > .gl-areas-process-h + .process-outcome,
.gl-main > .gl-areas-process-h + .gl-process-outcome {
  margin-top: var(--gap-md);
}
.gl-main > .process-outcome + .insight-strip,
.gl-main > .gl-process-outcome + .insight-strip,
.gl-main > .process-outcome + .so-what-callout,
.gl-main > .gl-process-outcome + .so-what-callout {
  margin-top: var(--gap-section);
}
/* distribute multi-item carriers inside the hero band without
   stretching individual short rows — use even track packing */
.slide.gl-density-hero .gl-main > .gl-areas-quote-stack,
.slide.gl-density-hero .gl-main > .quote-layout--stack {
  align-content: space-between;
  gap: var(--gap-stack);
}
.slide.gl-density-hero .gl-main > .process-flow--vertical {
  align-content: space-between;
  min-height: var(--hero-band-min);
}
.slide.gl-density-hero .gl-main > .comparison-grid {
  align-content: stretch;
}
.slide.gl-density-hero .gl-main > .gl-areas-metric .gl-stats.gl-grid-dense-2x2,
.slide.gl-density-hero .gl-main > .gl-areas-metric .gl-grid-dense-2x2 {
  min-height: calc(var(--hero-band-min) - 80px);
  align-content: stretch;
}
/* 1–2 item slides: never force min-height / space-between */
.slide:not(.gl-density-hero) .gl-main > .gl-areas-quote-stack,
.slide:not(.gl-density-hero) .gl-main > .quote-layout--stack,
.slide:not(.gl-density-hero) .gl-main > .process-flow--vertical,
.slide:not(.gl-density-hero) .gl-main > .comparison-grid {
  min-height: 0;
  align-content: start;
}

/* Universal composition grids */
.gl-grid {
  display: grid;
  gap: var(--gap-md);
  align-content: start;
  width: 100%;
}
.gl-grid-2 { grid-template-columns: 1fr 1fr; }
.gl-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.gl-grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.gl-grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.gl-grid-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
/* gl-grid-auto: dynamic column count via --step-count (horizontal process,
   process_with_decisions). Renders steps left-to-right; falls back to 3. */
.gl-grid-auto {
  grid-template-columns: repeat(var(--step-count, 3), minmax(0, 1fr));
  align-items: start;
}
.gl-grid-dense-2x2 {
  grid-template-columns: 1fr 1fr;
  grid-auto-rows: auto;
  /* multi-item KPI board: roomier cell gap so the 2×2 claims mid-canvas */
  gap: var(--gap-section);
  min-height: 0;
}

/* Cover bi-band named areas */
.gl-areas-cover {
  display: grid;
  grid-template-rows: 62% 38%;
  grid-template-areas:
    "band-navy"
    "band-blue";
  height: 100%;
  width: 100%;
  padding: 0;
}
.gl-band-navy { grid-area: band-navy; background: var(--navy); color: var(--ink-on-navy); }
.gl-band-blue { grid-area: band-blue; background: var(--blue); color: var(--ink-on-navy); }

/* Split dual-rail: lead full-width + arg | proof */
.gl-areas-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-areas:
    "lead lead"
    "arg  proof";
  gap: 40px 22px;
  align-items: start;
  width: 100%;
}
.gl-areas-split .gl-lead  { grid-area: lead;  min-width: 0; }
.gl-areas-split .gl-arg   { grid-area: arg;   min-width: 0; }
.gl-areas-split .gl-proof { grid-area: proof; min-width: 0; }

/* Metric / table KPI region */
.gl-areas-metric {
  display: grid;
  grid-template-areas:
    "stats"
    "insight";
  gap: var(--gap-section);
  align-content: start;
  width: 100%;
}
.gl-areas-metric .gl-stats   { grid-area: stats; }
.gl-areas-metric .gl-insight { grid-area: insight; }

/* Process vertical rail (timeline) */
.gl-areas-process-v {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--gap-md);
  align-content: start;
  width: 100%;
  position: relative;
}

/* Process horizontal + full-width outcome */
.gl-areas-process-h {
  display: grid;
  grid-template-columns: repeat(var(--step-count, 3), minmax(0, 1fr));
  gap: 24px;
  align-items: start;
  width: 100%;
}
.gl-process-outcome {
  grid-column: 1 / -1;
  margin-top: 8px;
}

/* Quote stack (vertical full-width)
   2–3 voice cards: loose gap fills mid-canvas without flex-stretch on each card. */
.gl-areas-quote-stack {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--gap-stack-loose);
  align-content: start;
  width: 100%;
  /* When main has spare height, keep items top-aligned (no space-between):
     short 1-quote single path does not use this class. */
}

/* Card primitive */
.gl-card {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--card-radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 0;
  flex: 0 0 auto; /* pack-from-top; never stretch short lists */
  min-width: 0;
}
.gl-card-hat {
  background: var(--navy);
  color: var(--ink-on-navy);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.01em;
  text-transform: none;
  min-height: 64px;
  padding: 16px 22px;
  display: flex;
  align-items: center;
  margin: 0;
}
.gl-card-body {
  padding: 6px 22px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Freeform named-area frame (visual_spec.grid)
   template-areas / columns / rows are set inline with SINGLE-quoted area names
   so the HTML style="..." attribute does not terminate early. */
.gl-areas-freeform {
  display: grid;
  grid-template-columns: var(--gl-ff-cols, 1fr 1fr);
  grid-template-rows: var(--gl-ff-rows, auto);
  gap: var(--gl-ff-gap, 22px);
  align-content: start;
  align-items: start;
  justify-items: stretch;
  width: 100%;
  min-width: 0;
  min-height: 0;
  box-sizing: border-box;
}
.gl-areas-freeform .gl-slot {
  min-width: 0;
  min-height: 0;
  align-content: start;
  box-sizing: border-box;
}
.gl-areas-freeform .gl-slot .bullet-list {
  margin: 0;
  width: 100%;
}
.gl-areas-freeform .gl-slot .gl-grid,
.gl-areas-freeform .gl-slot .gl-grid-2 {
  display: grid;
  width: 100%;
  gap: 16px;
}
.gl-areas-freeform .gl-slot .kpi-card {
  width: 100%;
  min-width: 0;
}
.gl-empty {
  margin: 0;
  color: var(--ink-faint);
  font-size: var(--fs-meta);
}

/* Debug outlines (enabled via body.gl-debug) */
body.gl-debug .gl-header,
body.gl-debug .gl-main,
body.gl-debug .gl-footer,
body.gl-debug .gl-lead,
body.gl-debug .gl-arg,
body.gl-debug .gl-proof,
body.gl-debug .gl-card,
body.gl-debug .gl-areas-freeform .gl-slot {
  outline: 1px dashed rgba(0, 111, 207, 0.45);
}

/* V5 board fill: IR boards grow into the main row instead of packing from
   the top — the PDF boards fill the stage. .gl-main is block by default
   (pack-from-top); scoped per layout so prose/list layouts keep top-pack. */
.gl-slide.layout-multi_panel .gl-main,
.gl-slide.layout-pill_comparison .gl-main,
.gl-slide.layout-chart_hero_dual .gl-main,
.gl-slide.layout-grouped_bar_chart .gl-main,
.gl-slide.layout-stacked_bar_chart .gl-main,
.gl-slide.layout-horizontal_bar_chart .gl-main,
.gl-slide.layout-line_chart .gl-main,
.gl-slide.layout-combo_chart .gl-main,
.gl-slide.layout-dual_chart .gl-main {
  display: flex;
  flex-direction: column;
}
.gl-slide.layout-multi_panel .gl-multi-panel,
.gl-slide.layout-chart_hero_dual .gl-areas-chart-hero,
.gl-slide.layout-grouped_bar_chart .chart-frame,
.gl-slide.layout-stacked_bar_chart .chart-frame,
.gl-slide.layout-horizontal_bar_chart .chart-frame,
.gl-slide.layout-line_chart .chart-frame,
.gl-slide.layout-combo_chart .chart-frame {
  flex: 1;
  min-height: 0;
}
/* Chart frame becomes a column host so the wrap grows past the 480px
   default; the 52vh cap would defeat the fill, so lift it in this context.
   The wrap sits inside .chart-svg-wrap > .chart-col intermediates, so the
   column-flex chain must run through them too. */
.gl-slide.layout-grouped_bar_chart .chart-frame,
.gl-slide.layout-stacked_bar_chart .chart-frame,
.gl-slide.layout-horizontal_bar_chart .chart-frame,
.gl-slide.layout-line_chart .chart-frame,
.gl-slide.layout-combo_chart .chart-frame,
.gl-slide.layout-chart_hero_dual .gl-chart-hero-chart,
.gl-slide.layout-grouped_bar_chart .chart-frame .chart-svg-wrap,
.gl-slide.layout-stacked_bar_chart .chart-frame .chart-svg-wrap,
.gl-slide.layout-horizontal_bar_chart .chart-frame .chart-svg-wrap,
.gl-slide.layout-line_chart .chart-frame .chart-svg-wrap,
.gl-slide.layout-combo_chart .chart-frame .chart-svg-wrap,
.gl-slide.layout-grouped_bar_chart .chart-frame .chart-col,
.gl-slide.layout-stacked_bar_chart .chart-frame .chart-col,
.gl-slide.layout-horizontal_bar_chart .chart-frame .chart-col,
.gl-slide.layout-line_chart .chart-frame .chart-col,
.gl-slide.layout-combo_chart .chart-frame .chart-col {
  display: flex;
  flex-direction: column;
}
.gl-slide.layout-grouped_bar_chart .chart-frame .chart-svg-wrap,
.gl-slide.layout-stacked_bar_chart .chart-frame .chart-svg-wrap,
.gl-slide.layout-horizontal_bar_chart .chart-frame .chart-svg-wrap,
.gl-slide.layout-line_chart .chart-frame .chart-svg-wrap,
.gl-slide.layout-combo_chart .chart-frame .chart-svg-wrap,
.gl-slide.layout-grouped_bar_chart .chart-frame .chart-col,
.gl-slide.layout-stacked_bar_chart .chart-frame .chart-col,
.gl-slide.layout-horizontal_bar_chart .chart-frame .chart-col,
.gl-slide.layout-line_chart .chart-frame .chart-col,
.gl-slide.layout-combo_chart .chart-frame .chart-col {
  flex: 1;
  min-height: 0;
}
.gl-slide.layout-grouped_bar_chart .chart-frame .chartjs-wrap,
.gl-slide.layout-stacked_bar_chart .chart-frame .chartjs-wrap,
.gl-slide.layout-horizontal_bar_chart .chart-frame .chartjs-wrap,
.gl-slide.layout-line_chart .chart-frame .chartjs-wrap,
.gl-slide.layout-combo_chart .chart-frame .chartjs-wrap,
.gl-slide.layout-chart_hero_dual .gl-chart-hero-chart .chartjs-wrap {
  flex: 1;
  min-height: 280px;
  max-height: none;
}


/* Boardroom component chrome on top of gl-* primitives */

/* ---- Header typography ---- */
.slide-title {
  margin: 0 0 10px;
  font-family: var(--font-display);
  font-size: var(--fs-title);
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.02em;
  line-height: 1.1;
  text-align: left;
}
.subtitle.dek, .gl-dek {
  margin: 0;
  font-size: var(--fs-sub);
  font-weight: 600;
  color: var(--ink-muted);
  line-height: 1.3;
  text-align: left;
  max-width: 1500px;
}
/* Dek itself has no bottom margin; .gl-header owns header→main gap. */
.gl-header .subtitle.dek,
.gl-header .gl-dek {
  margin-bottom: 0;
}
.lead-band, .gl-lead-text {
  margin: 0 0 var(--gap-md);
  font-size: var(--fs-lead);
  color: var(--ink);
  line-height: 1.4;
  text-align: left;
}

/* ---- Insight strip (so_what) ---- */
.insight-strip, .so-what-callout {
  margin-top: var(--gap-section);
  font-size: var(--fs-insight);
  font-weight: 600;
  color: var(--navy);
  line-height: 1.3;
  text-align: left;
  max-width: 1500px;
}

/* ---- Source strip (file names only) ---- */
.source-strip {
  margin-top: var(--gap-sm);
  font-size: var(--fs-meta);
  color: var(--ink-faint);
  letter-spacing: 0.02em;
}

/* ---- KPI cards ---- */
.kpi-card {
  background: var(--gradient-panel), var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-2);
  padding: var(--size-7) var(--size-8);
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
  flex: 0 0 auto;
}
.kpi-value {
  font-family: var(--font-num);
  font-size: var(--fs-kpi);
  font-weight: 700;
  color: var(--blue);
  font-variant-numeric: tabular-nums;
  line-height: 1.05;
  letter-spacing: -0.02em;
}
.kpi-label {
  font-size: var(--fs-kpi-label);
  font-weight: 700;
  color: var(--navy);
  line-height: 1.25;
  max-width: 22ch;
}
.kpi-source {
  font-size: var(--fs-meta);
  color: var(--ink-faint);
}

/* Multi-item KPI board: taller cards claim mid-canvas; still content-height
   flex (not height:100% stretch on sparse single-kpi cases). */
.layout-metric .gl-grid-dense-2x2 .kpi-card,
.layout-metric_dashboard .gl-grid-dense-2x2 .kpi-card {
  min-height: 240px;
  padding: var(--size-8) var(--size-9);
}
.layout-table-as-kpi .kpi-card { min-height: 180px; }
.layout-metric .gl-grid-dense-2x2,
.layout-metric_dashboard .gl-grid-dense-2x2,
.layout-table-as-kpi .gl-grid-dense-2x2 {
  gap: var(--gap-section);
}

/* ============================================================
   Option D — multi-item type + padding absorbs height as content
   Only active on section.gl-density-hero (item_count >= 3).
   Sparse 1–2 item slides keep the base (smaller) type scale.
   ============================================================ */
.slide.gl-density-hero .gl-grid-dense-2x2 .kpi-card {
  min-height: 260px;
  padding: var(--size-9) var(--size-10);
}
.slide.gl-density-hero .gl-grid-dense-2x2 .kpi-value {
  font-size: 76px;
}
.slide.gl-density-hero .gl-grid-dense-2x2 .kpi-label {
  font-size: var(--fs-insight);
  max-width: 24ch;
}
.slide.gl-density-hero .quote-card {
  padding: var(--size-9) 44px;
}
.slide.gl-density-hero .quote-layout--stack .quote-card blockquote,
.slide.gl-density-hero .gl-areas-quote-stack .quote-card blockquote {
  font-size: var(--fs-insight);
  line-height: 1.42;
  margin-bottom: var(--size-4);
}
.slide.gl-density-hero .quote-card cite {
  font-size: 21px;
}
.slide.gl-density-hero .process-flow--vertical .step-text {
  font-size: 28px;
}
.slide.gl-density-hero .process-flow--vertical .step-kicker {
  font-size: 34px;
}
.slide.gl-density-hero .process-flow--vertical .step-number {
  width: 60px;
  height: 60px;
  font-size: var(--fs-body);
}
.slide.gl-density-hero .process-flow--vertical {
  gap: var(--gap-stack-loose);
}
.slide.gl-density-hero .comparison-card {
  min-height: 240px;
}
.slide.gl-density-hero .comparison-card .card-head {
  font-size: 28px;
  padding: 18px 22px;
}
.slide.gl-density-hero .comparison-card .card-body {
  font-size: 23px;
  padding: var(--size-5) 22px;
}
.slide.gl-density-hero .process-flow--horizontal .step-card {
  min-height: 180px;
  padding: 26px var(--size-5);
}
.slide.gl-density-hero .process-flow--horizontal .step-text {
  font-size: 28px;
}
.slide.gl-density-hero .icon-tile {
  min-height: 168px;
  padding: 26px;
}
.slide.gl-density-hero .icon-tile .tile-title {
  font-size: var(--fs-kpi-label);
}
.slide.gl-density-hero .gl-card-hat,
.slide.gl-density-hero .panel-kicker {
  font-size: var(--fs-insight);
  min-height: 64px;
  padding: var(--size-4) 22px;
}

/* ---- Bullets / proof lists ---- */
.bullet-list, .proof-list {
  list-style: none;
  margin: 0;
  padding: 6px 22px var(--size-4);
  display: flex;
  flex-direction: column;
  gap: var(--size-3);
}
.bullet-list li, .proof-list li {
  font-size: var(--fs-body);
  line-height: 1.35;
  color: var(--ink);
  display: flex;
  gap: 10px;
  align-items: flex-start;
  flex: 0 0 auto;
}
.bullet-list li::before {
  content: "";
  width: 8px; height: 8px; margin-top: 9px;
  border-radius: var(--radius-round);
  background: var(--blue);
  flex-shrink: 0;
}
.proof-list li .ic {
  flex-shrink: 0; width: 20px; height: 20px; margin-top: 2px;
  color: var(--blue);
}

/* ---- Fact tiles ---- */
.fact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--size-3);
  padding: 6px 22px var(--size-4);
}
.fact-tile {
  display: flex;
  flex-direction: column;
  gap: var(--size-1);
  flex: 0 0 auto;
}
.fact-value {
  font-family: var(--font-num);
  font-size: 28px;
  font-weight: 700;
  color: var(--navy);
}
.fact-label {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-muted);
}

/* ---- Comparison / risk cards ---- */
.comparison-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap-section);
  align-content: start;
}
.comparison-card {
  background: var(--ink-on-navy);
  border: 1.5px solid var(--navy);
  border-radius: var(--radius-4);
  overflow: hidden;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  flex: 0 0 auto;
}
.comparison-card .card-head {
  background: var(--navy);
  color: var(--ink-on-navy);
  font-size: var(--fs-insight);
  font-weight: 700;
  padding: var(--size-4) var(--size-5);
  text-align: center;
}
.comparison-card .card-body {
  padding: 18px var(--size-5);
  font-size: var(--fs-body);
  line-height: 1.35;
  color: var(--ink);
  text-align: center;
}

/* ---- Tables ---- */
.table-frame {
  width: 100%;
  max-width: 1680px;
  overflow: hidden;
  border-radius: var(--radius-3);
  border: 1px solid var(--panel-border);
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-bridge);
}
.data-table th {
  background: var(--navy);
  color: var(--ink-on-navy);
  font-size: 20px;
  font-weight: 700;
  padding: 14px var(--size-4);
  text-align: center;
  border-right: 0;
}
.data-table td {
  padding: var(--size-3) var(--size-4);
  text-align: center;
  border-bottom: 1px solid var(--grid);
  color: var(--ink);
}
.data-table tbody tr:nth-child(even) { background: var(--bg-soft); }
.data-table td.num {
  color: var(--blue);
  font-family: var(--font-num);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* ---- Process / timeline ---- */
.process-flow--vertical {
  display: grid;
  gap: var(--gap-stack);
  position: relative;
  padding-left: var(--size-2);
}
.process-flow--vertical::before {
  content: "";
  position: absolute;
  left: 35px; top: 12px; bottom: 12px;
  width: 3px;
  background: rgba(0, 23, 90, 0.18);
}
.step-card {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: var(--gap-md, 18px);
  align-items: start;
  flex: 0 0 auto;
}
.step-number {
  width: 56px; height: 56px;
  border-radius: var(--radius-round);
  background: var(--navy);
  color: var(--ink-on-navy);
  font-family: var(--font-num);
  font-size: 20px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1;
}
.process-flow--horizontal {
  display: grid;
  grid-template-columns: repeat(var(--step-count, 3), minmax(0, 1fr));
  gap: var(--size-6);
  align-items: start;
}
.process-flow--horizontal .step-card {
  grid-template-columns: 1fr;
  background: var(--panel);
  border-radius: var(--radius-panel);
  padding: 22px 18px;
  min-height: 150px;
  text-align: center;
}
.process-flow--horizontal .step-number {
  margin: 0 auto var(--size-3);
  width: 56px; height: 56px; font-size: 20px;
}
.step-kicker {
  font-family: var(--font-num);
  font-size: 32px;
  font-weight: 700;
  color: var(--blue);
  text-transform: none;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.process-flow--horizontal .step-kicker {
  font-size: var(--fs-bridge);
  color: var(--blue);
}
.step-text {
  font-size: var(--fs-insight);
  font-weight: 700;
  color: var(--navy);
  line-height: 1.25;
}
.process-flow--horizontal .step-text {
  font-size: var(--fs-insight);
}
.process-outcome, .gl-process-outcome {
  display: grid;
  grid-template-columns: auto auto 1fr;
  gap: var(--size-4);
  align-items: center;
  background: var(--gradient-panel), var(--panel);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-3);
  padding: 18px var(--size-6);
  /* tight under horizontal platform row — do not inherit hero mid-canvas gap */
  margin-top: var(--gap-md);
  flex: 0 0 auto;
}
.process-outcome .badge {
  width: var(--size-11, 48px); height: var(--size-11, 48px); border-radius: var(--radius-round);
  background: var(--blue); color: var(--ink-on-navy);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-family: var(--font-num);
}
.process-outcome .kicker {
  font-size: var(--fs-bridge); font-weight: 700; color: var(--blue);
  text-transform: uppercase; letter-spacing: 0.04em;
}
.process-outcome .text {
  font-size: var(--fs-kpi-label); font-weight: 600; color: var(--navy);
}

/* ---- Quotes ---- */
.quote-card {
  background: var(--gradient-panel), var(--panel);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-2);
  padding: var(--size-7) var(--size-9);
  border-left: 4px solid var(--navy);
  flex: 0 0 auto;
}
.quote-layout--stack .quote-card {
  /* stack cards slightly roomier so three voices don't read as a brick */
  padding: var(--size-8) var(--size-10);
}
.quote-card blockquote {
  margin: 0 0 14px;
  font-size: var(--fs-kpi-label);
  font-weight: 400;
  color: var(--ink);
  line-height: 1.4;
  quotes: none;
}
.quote-card cite {
  display: block;
  font-style: normal;
  font-size: 20px;
  font-weight: 600;
  color: var(--navy);
}
.quote-layout--single blockquote { font-size: 32px; }
.quote-layout--stack {
  /* alias if markup uses component class instead of gl-areas-quote-stack */
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--gap-stack-loose);
  align-content: start;
  width: 100%;
}
.quote-insight {
  margin-top: var(--gap-section);
  font-size: var(--fs-insight);
  font-weight: 600;
  color: var(--navy);
}

/* ---- Icons ---- */
.icon, .ic {
  width: 24px; height: 24px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.icon-lg { width: 64px; height: 64px; }
.icon-sm { width: 20px; height: 20px; }
.icon-tile {
  display: flex; flex-direction: column; gap: var(--size-3);
  background: var(--gradient-panel), var(--panel);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-2);
  padding: 22px;
  min-height: 140px;
  flex: 0 0 auto;
}
.icon-tile .tile-title {
  font-size: var(--fs-body); font-weight: 700; color: var(--navy);
}
.icon-tile .tile-body {
  font-size: var(--fs-bridge); color: var(--ink); line-height: 1.35;
}
.icon-tile .ic { color: var(--blue); width: 32px; height: 32px; }

/* ---- Cover ---- */
.cover-inner .title-stack {
  padding: var(--size-15) var(--pad-x) var(--size-11);
  max-width: 1400px;
}
.cover-inner .kicker {
  font-size: var(--fs-bridge); font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; opacity: 0.85; margin-bottom: 18px;
}
.cover-inner h1 {
  margin: 0 0 var(--gap-md, 18px);
  font-family: var(--font-display);
  font-size: var(--fs-display);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--ink-on-navy);
}
.cover-inner .headline {
  margin: 0;
  font-size: var(--fs-insight);
  font-weight: 400;
  opacity: 0.92;
  max-width: 1200px;
}
.cover-inner .title-footer {
  padding: var(--size-7) var(--pad-x);
  font-size: var(--fs-bridge);
  font-weight: 600;
}

/* ---- Chart frame ---- */
.chart-frame {
  width: 100%;
  background: var(--gradient-panel), var(--panel);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-3);
  padding: 18px 22px;
  overflow: hidden;
}
.chart-frame svg, .chart-svg {
  width: 100%; height: auto; display: block;
}
/* Chart supporting elements (Fidelity T2): when a support table or metric
   strip shares the slide, shrink the SVG so everything fits the stage. */
.chart-frame .chart-svg-wrap { margin: 0 auto; }
.chart-frame .chart-svg-wrap.chart-split { width: 55%; }
.chart-frame .chart-svg-wrap.chart-with-stats { width: 60%; }
.chart-frame .chart-svg-wrap.chart-split.chart-with-stats { width: 44%; }
/* Plot-aligned support table (Fidelity T8/#36): the table sits inside
   .chart-col within the same width-constrained wrap as the SVG, so colgroup
   percentages share the SVG's width context and value columns center under
   the chart's category positions (spatial composition contract). */
.chart-svg-wrap .chart-col { width: 100%; }
.chart-table-aligned { table-layout: fixed; }
.chart-table-aligned th,
.chart-table-aligned td {
  padding-left: var(--size-1);
  padding-right: var(--size-1);
  overflow: hidden;
  text-overflow: ellipsis;
}
.chart-table-aligned th:first-child,
.chart-table-aligned td:first-child { text-align: left; }
/* White chart surface (Fidelity T9/#37): the PDF draws charts on white;
   opt in per slide via visual_spec.chart_config.surface = "white". */
.chart-frame.chart-surface-white {
  background: var(--color-surface, #ffffff);
}
.chart-frame .chart-metric-strip { margin-top: var(--size-3); }
.slide .chart-frame .chart-metric-strip .metric-tile {
  min-height: 0;
  padding: var(--size-3) var(--size-4);
}
.chart-empty {
  padding: var(--size-11); text-align: center;
  color: var(--ink-muted); font-size: 20px;
}

/* ---- Icon / SVG sprite host ---- */
.svg-sprite {
  position: absolute; width: 0; height: 0; overflow: hidden;
}

/* ============================================================
   Wave layouts — card typography (evidence, source, comparison,
   priority, trend, metric-tile, risk/opportunity, process-step,
   transformation, breakdown, insight-hero).
   These classes were added by the layout waves with no chrome;
   enroll them in the design-token type scale so card body text
   uses --fs-body and labels use --fs-kpi-label / --fs-meta.
   ============================================================ */

/* Shared card shell for wave cards that only carry .gl-card */
.evidence-card,
.source-card,
.comparison-col,
.priority-quadrant,
.kpi-trend-card,
.risk-card,
.opportunity-card,
.process-step,
.breakdown-card,
.transformation-step,
.decision-node {
  background: var(--gradient-panel), var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-2);
  padding: var(--size-6) var(--size-7);
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

/* Evidence cards: label (kpi-label) + value (body) */
.evidence-label {
  font-size: var(--fs-kpi-label);
  font-weight: 700;
  color: var(--navy);
  line-height: 1.15;
}
.evidence-value {
  font-size: var(--fs-body);
  color: var(--ink);
  line-height: 1.3;
}

/* Source deep-dive cards */
.source-label {
  margin: 0;
  font-size: var(--fs-lead);
  font-weight: 700;
  color: var(--navy);
  line-height: 1.2;
}
.source-card p {
  margin: 0;
  font-size: var(--fs-body);
  color: var(--ink);
  line-height: 1.35;
}
.source-eid {
  margin-top: auto;
  font-size: var(--fs-meta);
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

/* Three-column comparison */
.comparison-col .col-label {
  margin: 0;
  font-size: var(--fs-kpi-label);
  font-weight: 700;
  color: var(--navy);
}
.comparison-col p {
  margin: 0;
  font-size: var(--fs-body);
  color: var(--ink);
  line-height: 1.35;
}

/* Priority matrix quadrants */
.priority-quadrant .quadrant-label,
.priority-quadrant h4 {
  margin: 0;
  font-size: var(--fs-kpi-label);
  font-weight: 700;
  color: var(--navy);
}
.priority-quadrant p,
.priority-quadrant li {
  font-size: var(--fs-body);
  color: var(--ink);
  line-height: 1.3;
}

/* KPI trend cards */
.kpi-trend-card .kpi-label {
  font-size: var(--fs-kpi-label);
  font-weight: 700;
  color: var(--navy);
}
.kpi-trend-card .kpi-value {
  font-size: var(--fs-kpi);
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.kpi-trend-card .kpi-trend {
  font-size: var(--fs-body);
  color: var(--ink-muted);
}

/* Metric strip tiles (comparison_with_metrics) */
.metric-strip { margin-top: var(--gap-section); }
.metric-tile {
  background: var(--gradient-panel), var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-2);
  padding: var(--size-5) var(--size-6);
  text-align: center;
}
.metric-tile .metric-value {
  font-size: var(--fs-insight);
  font-weight: 700;
  color: var(--accent);
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.metric-tile .metric-label {
  margin-top: 6px;
  font-size: var(--fs-meta);
  color: var(--ink-muted);
}

/* Risk / opportunity columns */
.risk-card .card-head,
.opportunity-card .card-head {
  font-size: var(--fs-kpi-label);
  font-weight: 700;
  color: var(--navy);
}
.risk-card p,
.opportunity-card p,
.risk-card li,
.opportunity-card li {
  font-size: var(--fs-body);
  color: var(--ink);
  line-height: 1.35;
}

/* Process steps (process_with_decisions, horizontal_process) */
.process-step .step-num {
  font-size: var(--fs-insight);
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}
.process-step .step-text {
  font-size: var(--fs-body);
  color: var(--ink);
  line-height: 1.3;
}

/* Transformation steps (before_after_detailed) */
.transformation-step .step-num {
  font-size: var(--fs-insight);
  font-weight: 700;
  color: var(--accent);
}
.transformation-step .step-text {
  font-size: var(--fs-body);
  color: var(--ink);
  line-height: 1.3;
}

/* Breakdown cards (metric_row_with_breakdown) */
.breakdown-card .breakdown-key {
  font-size: var(--fs-body);
  color: var(--ink-muted);
}
.breakdown-card .breakdown-val {
  font-size: var(--fs-body);
  font-weight: 600;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

/* Insight hero (insight_with_evidence) */
.insight-hero {
  background: var(--navy);
  border: none;
  border-radius: var(--radius-panel);
  padding: var(--size-8) var(--size-9);
}
.insight-hero-text {
  font-size: var(--fs-insight);
  font-weight: 700;
  color: var(--ink-on-navy);
  line-height: 1.25;
}

/* Decision nodes in process_with_decisions */
.decision-node .decision-diamond {
  font-size: var(--fs-insight);
  color: var(--accent);
  line-height: 1;
}
.decision-node .decision-label {
  font-size: var(--fs-body);
  color: var(--ink);
  line-height: 1.3;
}

/* Hero-band min-height for wave cards when slide has >= 3 items.
   EXCLUDES risk-card / opportunity-card: those stay compact (natural
   height for 1-2 lines) so risk/opp columns don't stretch to fill. */
.slide.gl-density-hero .evidence-card,
.slide.gl-density-hero .source-card,
.slide.gl-density-hero .comparison-col,
.slide.gl-density-hero .priority-quadrant,
.slide.gl-density-hero .kpi-trend-card,
.slide.gl-density-hero .metric-tile {
  min-height: 180px;
}

/* ============================================================
   Layout-specific chrome for problem slides (21–24, 27, 31)
   ============================================================ */

/* ---- Risk / Opportunity (21) — vertical spread + larger type ---- */
.column-head {
  margin: 0 0 var(--gap-md, 18px);
  font-size: var(--fs-insight);
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.01em;
}
.risk-column .gl-grid,
.opportunity-column .gl-grid {
  gap: var(--gap-md);
  align-content: start;
}
/* Plain-text risk/opp cards: explicit font-size (they have no label/value
   spans, so text would inherit the browser default 16px). */
.risk-card,
.opportunity-card {
  font-size: var(--fs-body);
  line-height: 1.4;
  color: var(--ink);
  display: flex;
  align-items: flex-start;
}

/* ---- Recommendation with rationale (22) ---- */
.layout-recommendation {
  width: 100%;
}
.recommendation-head {
  margin-bottom: var(--gap-section);
  font-size: var(--fs-insight);
  font-weight: 700;
  color: var(--navy);
  line-height: 1.25;
  max-width: 1200px;
}
/* Plain-text evidence cards in recommendation layout need explicit font
   size (no label/value spans). */
.layout-recommendation .evidence-card {
  font-size: var(--fs-body);
  line-height: 1.4;
  color: var(--ink);
}

/* ---- Section divider (23) — centered, large, minimal ---- */
.layout-section-divider {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  height: 100%;
  min-height: 400px;
  gap: var(--gap-md);
}
.layout-section-divider .accent-line {
  width: 120px;
  height: 4px;
  background: var(--accent);
  border-radius: var(--radius-round);
  margin-bottom: var(--gap-md);
}
.layout-section-divider .section-message {
  margin: 0;
  font-size: var(--fs-display);
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.layout-section-divider .section-subtitle {
  margin: 0;
  font-size: var(--fs-sub);
  color: var(--ink-muted);
  font-weight: 500;
}

/* ---- Before / After detailed panels (24) ---- */
.before-panel,
.after-panel {
  background: var(--gradient-panel), var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-2);
  padding: var(--size-7) var(--size-8);
  display: flex;
  flex-direction: column;
  gap: var(--size-3);
}
.before-panel .panel-label,
.after-panel .panel-label {
  margin: 0;
  font-size: var(--fs-kpi-label);
  font-weight: 700;
  color: var(--navy);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.before-panel p,
.after-panel p {
  margin: 0;
  font-size: var(--fs-body);
  color: var(--ink);
  line-height: 1.4;
}
.before-panel { border-left: 4px solid var(--ink-muted); }
.after-panel  { border-left: 4px solid var(--accent); }

/* Transformation steps (24) — horizontal connector flow */
.transformation-steps {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: var(--gap-md);
  margin-top: var(--gap-section);
  align-content: start;
}
.transformation-step {
  display: flex;
  flex-direction: column;
  gap: var(--size-2);
  padding: var(--size-5) var(--size-6);
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-panel);
  font-size: var(--fs-body);
  color: var(--ink);
  line-height: 1.35;
}
.transformation-step .step-num {
  font-size: var(--fs-insight);
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}

/* ---- Horizontal process (27) & process_with_decisions (31) ----
   Steps + interleaved arrows/decision nodes flow left-to-right in ONE row.
   Flexbox (not gl-grid-auto columns) so step/arrow/step/arrow/step stays
   on a single line regardless of count; steps share space, arrows fixed. */
.layout-horizontal-process.gl-grid-auto,
.layout-process-decisions.gl-grid-auto {
  display: flex;
  flex-wrap: nowrap;
  align-items: stretch;
  gap: var(--gap-md);
}
.layout-horizontal-process .process-step,
.layout-process-decisions .process-step,
.layout-process-decisions .decision-node {
  flex: 1 1 0;
  min-width: 0;
}
.layout-horizontal-process .process-arrow {
  flex: 0 0 auto;
}
.layout-horizontal-process {
  align-items: start;
}
.process-step {
  text-align: center;
  padding: var(--size-6) var(--size-5);
}
.process-step .step-num {
  display: block;
  margin-bottom: 10px;
  font-size: var(--fs-insight);
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}
.process-step .step-text {
  font-size: var(--fs-body);
  color: var(--ink);
  line-height: 1.3;
}
.process-arrow {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  color: var(--accent);
  min-width: 48px;
  align-self: stretch;
  padding-top: var(--size-7);  /* aligns arrow with the step-number row */
}
.process-arrow svg {
  width: 28px;
  height: 28px;
}

/* ---- Process with decisions (31) ---- */
.layout-process-decisions {
  align-items: start;
}
.decision-node {
  text-align: center;
  padding: var(--size-6) var(--size-5);
}
.decision-node .decision-diamond {
  display: block;
  margin-bottom: 10px;
  font-size: 32px;
  color: var(--accent);
  line-height: 1;
}
.decision-node .decision-label {
  font-size: var(--fs-body);
  color: var(--ink);
  line-height: 1.3;
}

/* Chart support table (below line charts) */
.chart-support-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: var(--size-3);
  font-size: var(--fs-meta);
}
.chart-support-table th {
  background: var(--navy);
  color: var(--ink-on-navy);
  padding: var(--size-2) var(--size-3);
  text-align: center;
  font-weight: 700;
}
.chart-support-table td {
  padding: var(--size-2) var(--size-3);
  text-align: center;
  border-bottom: 1px solid var(--panel-border);
  color: var(--ink);
}
.chart-support-table tr:nth-child(even) td {
  background: var(--panel);
}

/* N6: outlined-box skin for secondary_visual tables (PDF provision boards).
   Opt-in via secondary_visual.skin="outlined_boxes": gray-stroked unfilled
   cells centered under each period column; the label block is taller
   (two-line label) and vertically centered with the cells. */
.chart-support-outlined {
  display: flex;
  align-items: center;
  margin-top: var(--size-3);
  background: transparent;
  /* #149: label lane may extend left of .chart-col via negative margin */
  overflow: visible;
  box-sizing: border-box;
}
.chart-svg-wrap.chart-align-table .chart-col {
  overflow: visible; /* allow outlined label lane left of column */
}
.chart-outlined-label,
.chart-outlined-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  min-width: 0;
}
.chart-outlined-label {
  flex: none;
}
.chart-outlined-cell {
  flex: 1;
}
.chart-outlined-box {
  border: 1px solid var(--ink-faint);
  border-radius: var(--radius-sm, 4px);
  background: transparent;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-sizing: border-box;
  font-size: var(--fs-sub, 22px);
  padding: var(--size-2, 8px) var(--size-3, 12px);
}
.chart-outlined-label .chart-outlined-box {
  width: 100%;
  max-width: 100%; /* #149: box stays inside reserved label lane */
  /* Readable floor for unaligned/ordinary rows; aligned lane owns width. */
  min-width: min(200px, 100%);
  min-height: 105px; /* PDF p15: two-line label block */
  font-weight: 600;
  line-height: 1.2;
  /* Allow the required Total Network Volumes label to remain readable. */
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 4;
  overflow: hidden;
  white-space: normal;
}
.chart-support-outlined.chart-table-aligned .chart-outlined-label .chart-outlined-box {
  min-width: 0; /* reserved lane width is the contract */
}
.chart-outlined-cell .chart-outlined-box {
  width: 40%; /* PDF p15: cell ~40% of column pitch, centered */
  min-width: 0;
  min-height: 58px; /* PDF p15: period cells */
  font-variant-numeric: tabular-nums;
}
/* #149 non-strict fallback when host cannot fit label min + N pitches */
.chart-support-outlined.chart-outlined-stacked {
  flex-wrap: wrap;
  width: 100% !important;
  margin-left: 0 !important;
  row-gap: var(--size-2, 8px);
}
.chart-support-outlined.chart-outlined-stacked .chart-outlined-label {
  flex: 1 0 100%;
  width: 100% !important;
  max-width: 100%;
  justify-content: flex-start;
}
.chart-support-outlined.chart-outlined-stacked .chart-outlined-label .chart-outlined-box {
  width: auto;
  max-width: 100%;
  min-width: min(200px, 100%);
}
.chart-support-outlined.chart-outlined-stacked .chart-outlined-cell {
  flex: 1 1 0;
  width: auto !important;
  min-width: 0;
}

/* Dual chart layout: two charts side by side (Fidelity T7/#35).
   N10: each pane is its own chart-frame card (the PDF draws two separate
   rounded panels, ~24px apart), filling the main band vertically; the plot
   wrap grows into the card like chartjs-fill does for flex tiles. */
.dual-chart {
    align-items: stretch;
    align-content: stretch;
    gap: var(--size-6);
    flex: 1;
    min-height: 0;
}
.dual-chart-pane {
    min-width: 0;
    display: flex;
    flex-direction: column;
}
.dual-chart-pane .chartjs-wrap {
    flex: 1;
    min-height: 0;
    height: auto;
    max-height: none;
}
.dual-chart-pane .chart-svg {
    width: 100%;
    height: auto;
}

/* Chart.js canvas host (P3) */
.chartjs-wrap {
  position: relative;
  width: 100%;
  height: 480px;
  max-height: 52vh;
  min-height: 280px;
}
.chartjs-canvas {
  width: 100% !important;
  height: 100% !important;
}

/* ------------------------------------------------------------------ */
/* ---------- table inset (key_stats gutter on data_table, #73/T12) ---------- */
/* R5-G/T12: the inset reserves a real gutter column instead of floating
   (absolute) over the table — row-reverse keeps it on the right like the
   PDF's VCE box, and the table shrinks into the remaining width. */
.gl-areas-table-inset {
  display: flex;
  flex-direction: row-reverse;
  gap: var(--gap-md, 18px);
  align-items: flex-start;
}
.gl-inset-stage { flex: 0 0 auto; }
.gl-inset-table { flex: 1; min-width: 0; }
.gl-inset-wrap { display: flex; flex-direction: column; gap: var(--gap-md, 18px); }
.gl-inset {
  min-width: 200px;
  padding: var(--space-4, 16px) var(--space-5, 20px);
  background: var(--navy);
  color: var(--color-on-navy, var(--panel, #fff));
  border-radius: var(--radius-md, 8px);
  box-shadow: var(--shadow-3, 0 8px 20px rgba(0, 23, 90, 0.18));
  text-align: left;
}
.gl-inset-label {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  opacity: 0.85;
  margin-bottom: 4px;
}
.gl-inset-value {
  font-family: var(--font-display, 'IBM Plex Sans', sans-serif);
  font-size: 34px;
  font-weight: 700;
  line-height: 1.05;
}

/* ---------- pill-column comparison table (#74/F4) ---------- */
.gl-pill {
  padding: var(--space-4, 16px) var(--space-5, 20px);
}
/* Freestanding pill statement columns (#91/F4+, finished): exterior label
   rail + fully separated bordered shells with full-width navy header caps —
   the IR summary-board recipe (white bodies, navy caps, no joined strip). */
.gl-pill-free {
  display: flex;
  flex-direction: row; /* explicit: .gl-card sets flex-direction: column */
  gap: var(--gap-sm, 12px);
  align-items: stretch;
  flex: 1;
  /* V5 fill: layout-pill_comparison .gl-main is a flex column now, so
     flex:1 stretches the board into the free canvas (the min-height clamp
     was the pre-fill workaround). */
  background: transparent; /* shed the gl-card strip chrome */
  border: none;
  box-shadow: none;
  padding: 0;
}
.gl-pill-labels {
  /* F4+: widened rail — PDF p3 label column ≈530px of the 1728px canvas
     (rail flex 1.35 ≈ 530px, shells ≈387px each at gap-sm gutters). */
  flex: 1.35;
  display: flex;
  flex-direction: column;
  gap: 0;
  justify-content: flex-start;
}
.gl-pill-shell {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0;
  /* paper, not --panel: handoff themes may tint --panel gray (F13), but the
     IR statement bodies are white — caps alone carry the navy. */
  background: var(--color-paper, #fff);
  border: 1px solid var(--navy);
  border-radius: var(--radius-lg, 12px);
  overflow: hidden; /* clip the cap to the shell's rounded top corners */
  padding: 0;
}
.gl-pill-shell-yoy {
  background: var(--color-paper, #fff); /* PDF: all bodies white; caps carry the navy */
}
.gl-pill-stub {
  flex: 1;
  display: flex;
  align-items: center;
  font-weight: 600;
  font-size: var(--fs-pill, 28px);
  color: var(--ink);
  text-align: left;
  padding: 8px 12px 8px 0;
}
.gl-pill-head-empty {
  visibility: hidden; /* rail slot matching the navy cap's height */
  flex: none;
  font-size: var(--fs-pill, 28px);
  font-weight: 700;
  min-height: 1lh;
  padding: 10px 8px;
  margin-bottom: 6px;
  border-bottom: none;
}
.gl-pill-head {
  flex: none;
  align-self: stretch;
  text-align: center;
  font-weight: 700;
  font-size: var(--fs-pill, 28px);
  color: var(--color-on-navy, var(--panel, #fff));
  background: var(--navy);
  border-radius: 0;
  padding: 10px 8px;
  margin-bottom: 6px;
}
.gl-pill-cell {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  /* V5/F4+: PDF statement values are navy semibold, not muted ink. */
  font-size: var(--fs-pill, 28px);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--navy);
  padding: 8px 12px;
}
.gl-pill-cell-yoy {
  font-weight: 700;
  color: var(--navy);
}

/* F4+ Amex summary board: direct five-row statements match PDF p3.
   :only-child leaves insight-bearing boards on flexible legacy packing. */
.slide[data-layout='pill_comparison'][data-items='5'] .gl-main > .gl-pill-free:only-child {
  flex: 0 0 624.64px;
  align-self: flex-start;
  width: 1564.911px;
  margin: 61.492px 0 0 31.312px;
  gap: 17.4445px;
}
.slide[data-layout='pill_comparison'][data-items='5'] .gl-main > .gl-pill-free:only-child > .gl-pill-labels {
  flex: 0 0 624.8335px;
}
.slide[data-layout='pill_comparison'][data-items='5'] .gl-main > .gl-pill-free:only-child > .gl-pill-shell {
  flex: 0 0 295.914px;
}
.slide[data-layout='pill_comparison'][data-items='5'] .gl-main > .gl-pill-free:only-child > .gl-pill-shell > .gl-pill-head,
.slide[data-layout='pill_comparison'][data-items='5'] .gl-main > .gl-pill-free:only-child > .gl-pill-labels > .gl-pill-head-empty {
  height: 115.2px;
  min-height: 115.2px;
  margin-bottom: 0;
}
.slide[data-layout='pill_comparison'][data-items='5'] .gl-main > .gl-pill-free:only-child > .gl-pill-shell > .gl-pill-head {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 8px;
  line-height: 1;
}
.slide[data-layout='pill_comparison'][data-items='5'] .gl-main > .gl-pill-free:only-child > .gl-pill-shell-yoy > .gl-pill-head {
  padding-inline: 76px;
}

/* ---------- chart | hero-KPI dual card (#75/F5) ---------- */
.gl-areas-chart-hero {
  display: grid;
  grid-template-columns: 2fr 1fr; /* R4 (v8): PDF chart:hero panel ratio is 2:1 */
  gap: var(--gap-md, 18px);
  align-items: stretch;
}
.gl-chart-hero-chart { min-width: 0; }
.gl-chart-hero-stack { display: flex; }
/* R4 finish (v8): the PDF draws the dual-metric hero side as ONE framed
   panel (fill --panel, full height, matching the chart panel) holding both
   metrics — not two stacked bordered cards. The frame lives on the stack;
   each .gl-hero becomes a transparent metric row inside it. */
.gl-hero-stack {
  display: flex;
  flex-direction: column;
  gap: var(--gap-md, 18px);
  flex: 1;
  background: var(--gradient-panel), var(--panel);
  border-radius: var(--radius-md, 14px);
  box-shadow: var(--shadow-3);
  padding: var(--size-5) var(--size-6);
}
/* R4 (#94, finished): IR giant-% pairing — blue digits with a visibly
   smaller % unit, narrated label beside the number. R4 finish (v8) moved the
   card chrome onto .gl-hero-stack above, so each .gl-hero is now a transparent
   metric row inside that framed panel. */
.gl-hero {
  flex: 1;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 18px;
  padding: 0 var(--size-2);
}
.gl-hero-value {
  font-family: var(--font-display, 'IBM Plex Sans', sans-serif);
  font-size: 110px;
  font-weight: 700;
  line-height: 1;
  color: var(--blue);
  white-space: nowrap;
}
.gl-hero-value-unit {
  font-size: 0.42em;
  font-weight: 700;
  vertical-align: baseline;
  margin-left: 0.06em;
}
.gl-hero-label {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--ink);
}

/* ---------- IR bullet sheet (#77/F7) ---------- */
.gl-areas-ir-bullets { display: block; }
.gl-ir-bullets {
  list-style: none;
  margin: 0;
  padding: 0;
  max-width: 100%;
}
.gl-ir-bullet {
  font-size: 20px;
  line-height: 1.5;
  color: var(--ink);
  padding: var(--space-3, 12px) 0;
  border-bottom: 1px solid var(--panel-border);
}
.gl-ir-bullet:last-child { border-bottom: none; }
.gl-ir-bullet strong { color: var(--navy); font-weight: 700; }

/* ---------- IR guidance statement card (#78/F8) ---------- */
.gl-areas-guidance { display: flex; flex-direction: column; gap: var(--gap-sm, 10px); }
.gl-guidance {
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-md, 8px);
  overflow: hidden;
  background: var(--color-surface, var(--panel, #fff));
}
.gl-guid-bar {
  background: var(--navy);
  color: var(--color-on-navy, var(--panel, #fff));
  font-weight: 700;
  font-size: 18px;
  padding: var(--space-3, 12px) var(--space-5, 20px);
}
.gl-guid-body { padding: var(--space-5, 20px); }
.gl-guid-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--gap-md, 18px);
  padding: var(--space-3, 12px) 0;
  border-bottom: 2px solid var(--navy);
}
.gl-guid-row:last-child { border-bottom: none; }
.gl-guid-label { font-weight: 600; color: var(--ink); font-size: 18px; }
.gl-guid-value {
  font-family: var(--font-display, 'IBM Plex Sans', sans-serif);
  font-weight: 700;
  font-size: 26px;
  color: var(--navy);
}
.gl-guid-footnotes { padding: 0 var(--space-5, 20px); }
.gl-guid-foot { font-size: 12px; color: var(--ink-muted); padding: 2px 0; }

/* ---------- brand cover / divider (#76/F6) ---------- */
.gl-brand {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: var(--gap-md, 18px);
  text-align: center;
}
.gl-brand-two-tone {
  background: linear-gradient(
    135deg,
    var(--navy) 0%,
    var(--navy) 55%,
    var(--blue, var(--color-primary, var(--navy))) 55%,
    var(--blue, var(--color-primary, var(--navy))) 100%
  );
  color: var(--color-on-navy, var(--panel, #fff));
}
.gl-brand-mark {
  width: 120px;
  height: 120px;
  object-fit: contain;
}
.gl-brand-mark-named {
  display: inline-flex;
  color: var(--color-on-navy, var(--panel, #fff));
}
.gl-brand-mark-named svg {
  width: 120px;
  height: 124px;
}
.gl-brand-title {
  font-family: var(--font-display, 'IBM Plex Sans', sans-serif);
  font-size: 44px;
  font-weight: 700;
  line-height: 1.1;
}
.gl-brand-sub {
  font-size: 20px;
  font-weight: 500;
  opacity: 0.9;
}
.gl-brand-divider .gl-brand-title { font-size: 36px; }

/* ---------- dense annex table (#81/F12) ---------- */
.gl-annex { width: 100%; }
.gl-annex-micro .data-table,
.annex-table {
  font-size: 12px;
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
.annex-table th,
.annex-table td {
  padding: var(--space-1, 4px) var(--space-2, 6px);
  border-bottom: 1px solid var(--panel-border);
  overflow: hidden;
  text-overflow: ellipsis;
}
.annex-table .gl-annex-stub {
  text-align: left;
  font-weight: 600;
  color: var(--ink);
  width: 18%;
}
.annex-table .gl-annex-head {
  font-weight: 700;
  /* F12+ finish: white-on-navy like the base th — this rule's navy text on
     the navy header bg left quarter sub-headers invisible (PDF annex
     sub-headers are white-on-navy). */
  color: var(--ink-on-navy, var(--color-on-navy, #fff));
  text-align: right;
  border-bottom: 2px solid var(--navy);
}
.annex-table .gl-annex-group {
  font-weight: 700;
  color: var(--color-on-navy, var(--panel, #fff));
  background: var(--navy);
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.03em;
  /* #103/F12+: visible cell separation for multi-header precision */
  border: 1px solid var(--panel, #fff);
  border-bottom-color: var(--panel-border);
}
/* gl-annex-group-alt: optional semantic band (not applied by index parity; T13).
   Default group cells stay navy; keep this rule for a future handoff-declared need. */
.annex-table .gl-annex-group-alt {
  background: var(--blue, var(--color-primary, #006fcf));
}
.annex-table th.gl-annex-stub {
  vertical-align: bottom;
  text-align: left;
}
/* F12+ finish: the multi-header stub slot (rowspan=2 top-left cell) is
   blank paper in the PDF, not a navy block. */
.annex-table thead th.gl-annex-stub {
  background: var(--color-paper, #fff);
}
.annex-table .gl-annex-cell { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- multi-panel board host (#80/F11) ---------- */
.gl-multi-panel {
  display: grid;
  gap: var(--gap-md, 18px);
  align-items: stretch;
}
.gl-multi-panel-2col { grid-template-columns: repeat(2, 1fr); }
.gl-multi-panel-3col { grid-template-columns: repeat(3, 1fr); }
.gl-tile {
  display: flex;
  flex-direction: column;
  padding: var(--space-4, 16px);
  background: var(--color-surface, var(--panel, #fff));
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-md, 8px);
  min-height: 200px;
}
.gl-tile-chart .chartjs-wrap { flex: 1; min-height: 0; }
.gl-tile-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-muted);
  margin-bottom: var(--space-2, 6px);
}
/* #139 R6-A pane-title CSS is emission-scoped (see charts/typography.py)
   so decks without chart pane headings stay byte-identical. */
.gl-tile-metric { justify-content: center; align-items: flex-start; }
.gl-tile-metric-value {
  font-family: var(--font-display, 'IBM Plex Sans', sans-serif);
  font-size: 40px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.05;
}
/* IR dual tall-card slots (#90/F11+) — only present when tiles use them. */
.gl-tile-tall {
  position: relative;
  min-height: 420px;
  background: var(--color-surface-muted, var(--stage, #f4f6f9));
}
.gl-tile-tall .chartjs-wrap { flex: 1; min-height: 280px; }
.gl-tile-top-total {
  font-family: var(--font-display, 'IBM Plex Sans', sans-serif);
  font-size: 28px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.1;
}
.gl-tile-badge {
  position: absolute;
  top: var(--space-3, 10px);
  right: var(--space-3, 10px);
  padding: 2px 8px;
  background: var(--navy);
  color: var(--color-on-navy, var(--panel, #fff));
  border-radius: var(--radius-round, 999px);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.gl-tile-body {
  display: flex;
  gap: var(--space-3, 10px);
  flex: 1;
  min-height: 0;
}
.gl-tile-chart-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.gl-tile-legend {
  list-style: none;
  margin: 0;
  padding: var(--space-2, 6px) 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2, 6px);
  min-width: 110px;
  font-size: 12px;
  color: var(--ink);
}
.gl-tile-legend-item { display: flex; align-items: center; gap: 6px; }
/* IR navy dual tall-card skin (#99/F11+): navy header band hosts the top
   total + tile title; body keeps the chart + flush exterior legend. */
.gl-tile-ir {
  overflow: hidden;
  padding: 0;
}
.gl-tile-ir-head {
  background: var(--navy);
  color: var(--color-on-navy, var(--panel, #fff));
  padding: var(--space-4, 16px) var(--space-5, 20px);
  display: flex;
  align-items: baseline;
  gap: var(--space-4, 12px);
}
.gl-tile-ir-total {
  font-family: var(--font-display, 'IBM Plex Sans', sans-serif);
  font-size: 40px;
  font-weight: 700;
  line-height: 1;
}
.gl-tile-ir-title {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  opacity: 0.9;
}
.gl-tile-ir .gl-tile-body,
.gl-tile-ir > .chartjs-wrap,
.gl-tile-ir > .chart-svg {
  margin: var(--space-4, 12px) var(--space-4, 12px) var(--space-3, 8px);
}
.gl-tile-swatch {
  width: 10px;
  height: 10px;
  border-radius: var(--radius-sm, 2px);
  flex: none;
}

/* ---------- chart annotation + axis-break markers (#71/F2, #79/F10) ---------- */
.chartjs-wrap { position: relative; }
/* N5: opt-in (chart_config.fill_tile) — grow the wrap into the flex tile's
   remaining height; lifts the default 480px/52vh clamp that otherwise caps
   the plot and leaves dead card space below it. */
.chartjs-wrap.chartjs-fill { flex: 1; min-height: 0; height: auto; max-height: none; }
/* R1 finish: stage=flat also flattens the FRAME card (the wrap-only flat
   left the gray Boardroom pad/shadow around the chart; the PDF sits the
   chart directly on the white canvas). */
.chart-frame.chart-frame-flat {
  background: transparent;
  border: none;
  box-shadow: none;
  border-radius: 0;
  padding: 0;
}
/* R1 (#94): flat IR stage — chart sits on the canvas without Boardroom
   stage padding/background. */
.chartjs-wrap.chartjs-flat {
  padding: 0;
  margin: 0;
  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;
}
.chartjs-annotation {
  position: absolute;
  top: 12%;
  left: 22%;
  padding: var(--space-2, 6px) var(--space-3, 10px);
  background: var(--panel);
  border: 1px dashed var(--navy);
  border-radius: var(--radius-sm, 4px);
  color: var(--navy);
  font-size: 13px;
  font-weight: 600;
  pointer-events: none;
  white-space: nowrap;
}
/* T6/R5-A: the break marker is a small // hatch glyph on the axis at its
   origin (PDF recipe) — NOT a line across the plot. The calloutGeometry
   plugin pins it from the live scales; these are JS-off fallbacks. */
.chartjs-axis-break {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 10px;
  height: 14px;
  pointer-events: none;
}
.chartjs-axis-break::before,
.chartjs-axis-break::after {
  content: "";
  position: absolute;
  top: 0;
  width: 2px;
  height: 100%;
  background: var(--ink-muted);
  transform: skewX(-18deg);
}
.chartjs-axis-break::before { left: 2px; }
.chartjs-axis-break::after { left: 6px; }
/* On horizontal bars the break is on the x axis — glyph hangs below the
   axis line at the origin (#88). */
.chartjs-axis-break-v {
  left: 0;
  top: 100%;
  bottom: auto;
}

/* ---------- IR bullet sheet centered title (#85) ---------- */
/* Centered-title chrome scoped to the ir_bullet_sheet layout only. */
.layout-ir_bullet_sheet .slide-header {
  text-align: center;
}

/* ---------- geometric callouts (#89/R2) ---------- */
.chartjs-callout {
  position: absolute;
  pointer-events: none;
}
.chartjs-callout-label {
  position: absolute;
  bottom: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  font-weight: 700;
  color: var(--navy);
  white-space: nowrap;
}
/* Elbow arrow (R2): blue capsule spanning the bar tops with the label
   inside, a computed stem dropping from the capsule's left end to the
   from-bar top, and a right-pointing arrowhead at the capsule's right end
   (PDF "+ ~6 percentage points" chrome). */
.chartjs-callout-elbow {
  top: 10%;
  height: 30px;
  background: var(--blue, var(--color-primary, #006fcf));
  /* A fixed radius, NOT --radius-round: that token is 50%, and a percentage
     radius on a wide short box is an ellipse by definition — once the plugin
     spanned this capsule bar-centre to bar-centre (543x30) it painted as a
     LENS, measured 30px thick at centre tapering to 14px at the ends.
     --radius-md (14px) is ~half the 30px height, so ends stay true pills. */
  border-radius: var(--radius-md, 14px);
  display: flex;
  align-items: center;
  justify-content: center;
}
.chartjs-callout-elbow::after {
  content: "";
  position: absolute;
  right: -11px;
  top: 50%;
  transform: translateY(-50%);
  width: 0;
  height: 0;
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
  border-left: 11px solid var(--blue, var(--color-primary, #006fcf));
}
/* Computed stem: vertical drop from the capsule to the from-bar top.
   Geometry (left/top/height %) is emitted inline by charts.py. */
.chartjs-callout-elbow-stem {
  position: absolute;
  pointer-events: none;
  width: 0;
  border-left: 2px solid var(--blue, var(--color-primary, #006fcf));
}
.chartjs-callout-elbow .chartjs-callout-label {
  position: static;
  transform: none;
  color: var(--color-on-navy, var(--panel, #fff));
  font-size: 13px;
}
/* Line-art elbow (R2, opt-in style: line): the PDF recipe is a thin
   4px blue rule from the from-bar centre to an arrowhead on the to-bar
   centre, with the label as an opaque blue pill centred ON the rule
   (interrupting it) instead of one continuous thick capsule. Measured on
   PDF page 6: rule 4pt thick spanning bar0->bar4 centres, pill 213x31pt
   centred on the rule, arrowhead 12x12pt. Same calloutGeometry plugin
   positioning as the capsule; only the chrome differs. */
.chartjs-callout-elbow-line {
  height: 0;
  background: transparent;
  border-radius: 0;
  border-top: 4px solid var(--blue, var(--color-primary, #006fcf));
}
.chartjs-callout-elbow-line::after {
  right: -12px;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  border-left: 12px solid var(--blue, var(--color-primary, #006fcf));
}
.chartjs-callout-elbow-line .chartjs-callout-label {
  position: absolute;
  bottom: auto;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: var(--blue, var(--color-primary, #006fcf));
  color: var(--color-on-navy, var(--panel, #fff));
  border-radius: var(--radius-md, 14px);
  padding: var(--size-1, 4px) var(--size-4, 16px);
  font-size: 14px;
}
.chartjs-callout-elbow-line + .chartjs-callout-elbow-stem {
  border-left-width: 4px;
}
/* Chevron marker under the category axis (R2/T7): two stacked sibling
   nodes — a navy down-triangle above a separate navy pill (PDF Refresh
   marker). The calloutGeometry plugin stacks them below scales.x.bottom
   (tick row included); the bottom offsets here are JS-off fallbacks. */
.chartjs-callout-chevron-tip {
  bottom: 34px;
  /* The CSS triangle idiom needs a zero CONTENT box, but this deck sets
     box-sizing: border-box globally, which would collapse width/height:0 into a
     34x22 border-box and paint a solid navy block over the bars. */
  box-sizing: content-box;
  width: 0;
  height: 0;
  /* V5/R2: chunky IR triangle — the 14/18 chip read as a speck next to the
     PDF's under-axis Refresh marker. */
  border-left: 22px solid transparent;
  border-right: 22px solid transparent;
  border-top: 15px solid var(--navy);
}
.chartjs-callout-chevron-pill {
  bottom: 4px;
  background: var(--navy);
  color: var(--color-on-navy, var(--panel, #fff));
  /* --radius-round is 50%, which makes an ellipse on a wide short box (same trap
     as the T1 capsule). A fixed radius >= half the height gives a true pill. */
  border-radius: var(--radius-md, 14px);
  padding: var(--size-1, 4px) var(--size-6, 24px);
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
}
/* Event band: translucent vertical span over the plot. */
.chartjs-callout-band {
  top: 6%;
  bottom: 8%;
  background: rgba(0, 23, 90, 0.06);
  border-left: 1px dashed var(--navy);
  border-right: 1px dashed var(--navy);
}
.chartjs-callout-band .chartjs-callout-label {
  bottom: auto;
  top: -18px;
}
/* Measure rule (N8): thin dual-ended navy rule from the first to the last
   bar centre, arrowheads at both ends, a blue pill interrupting the rule
   at its midpoint, and an optional gray sub-caption beneath the pill
   (PDF slide-16 "17% / Year" + "% CAGR" recipe). The calloutGeometry
   plugin pins the span to the bar centres and lifts the node above the
   tallest bar; the top % here is the JS-off fallback. */
.chartjs-callout-measure {
  top: 8%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.chartjs-callout-measure::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  border-top: 2px solid var(--navy);
}
/* 6x6 arrowheads at both ends pointing outward, tips on the bar centres
   (measured on the PDF: 6pt wide x 6pt tall, navy). */
.chartjs-callout-measure-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  box-sizing: content-box;
  width: 0;
  height: 0;
  border-top: 3px solid transparent;
  border-bottom: 3px solid transparent;
}
.chartjs-callout-measure-arrow-l {
  left: 0;
  border-right: 6px solid var(--navy);
}
.chartjs-callout-measure-arrow-r {
  right: 0;
  border-left: 6px solid var(--navy);
}
.chartjs-callout-measure-pill {
  position: relative;
  background: var(--blue, var(--color-primary, #006fcf));
  color: var(--color-on-navy, var(--panel, #fff));
  /* --radius-round is 50% and paints an ellipse on a wide short box;
     a fixed radius >= half the height gives a true pill. */
  border-radius: var(--radius-md, 14px);
  padding: var(--size-1, 4px) var(--size-3, 12px);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.chartjs-callout-measure-caption {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-top: var(--size-1, 4px);
  font-size: 12px;
  color: var(--ink, #53565a);
  white-space: nowrap;
}

/* ---------- chrome level: stage-only / minimal (#83/F14) ---------- */
/* Boardroom full chrome remains the default; minimal hides product chrome
   (deck controls, cover eyebrow, Boardroom foot brand) for parity/export. */
body.gl-chrome-minimal .deck-controls { display: none; }
body.gl-chrome-minimal .cover-inner .kicker { display: none; }
body.gl-chrome-minimal .title-footer,
body.gl-chrome-minimal .cover-date { display: none; }

/* Native progressive disclosure (P5) — HTML/CSS only, no JS library  */
/* ------------------------------------------------------------------ */
.gl-disclosure {
  margin: var(--space-md, 20px) 0 var(--space-sm, 12px);
  font-family: var(--font-body);
  color: var(--color-ink, var(--ink));
}
.gl-disclosure details {
  border: 1px solid var(--color-panel-border, var(--panel-border));
  border-radius: var(--radius-sm, 8px);
  background: var(--color-surface-soft, var(--bg-soft));
  margin-bottom: var(--size-2, 8px);
  overflow: hidden;
}
.gl-disclosure summary {
  cursor: pointer;
  list-style: none;
  padding: var(--size-3, 12px) var(--size-4, 16px);
  font-weight: 600;
  font-size: var(--text-sm, 14px);
  color: var(--color-primary, var(--navy));
  background: var(--color-panel, var(--panel));
}
.gl-disclosure summary::-webkit-details-marker { display: none; }
.gl-disclosure summary::before {
  content: "▸";
  display: inline-block;
  margin-right: var(--size-2, 8px);
  transition: transform 0.12s ease;
}
.gl-disclosure details[open] > summary::before { transform: rotate(90deg); }
.gl-disclosure-body {
  padding: var(--size-3, 12px) var(--size-4, 16px) var(--size-4, 16px);
  font-size: var(--fs-body, 22px);
  line-height: 1.35;
}
.gl-disclosure-body p { margin: 0 0 var(--size-2, 8px); }
.gl-disclosure-body ul { margin: 0; padding-left: var(--size-5, 20px); }

/* Radio CSS tabs */
.gl-disclosure-tabs { position: relative; }
.gl-disclosure-tabs > .gl-tab-input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  width: 0;
  height: 0;
}
.gl-tab-list {
  display: flex;
  flex-wrap: wrap;
  gap: var(--size-2, 8px);
  margin-bottom: var(--size-3, 12px);
  border-bottom: 2px solid var(--color-panel-border, var(--panel-border));
  padding-bottom: var(--size-2, 8px);
}
.gl-tab {
  cursor: pointer;
  padding: var(--size-2, 8px) var(--size-4, 16px);
  border-radius: var(--radius-sm, 8px) var(--radius-sm, 8px) 0 0;
  font-weight: 600;
  font-size: var(--text-sm, 14px);
  color: var(--color-ink-muted, var(--ink-muted));
  background: transparent;
  border: 1px solid transparent;
}
.gl-tab-panels {
  border: 1px solid var(--color-panel-border, var(--panel-border));
  border-radius: var(--radius-sm, 8px);
  background: var(--color-surface, var(--slide-bg));
  padding: var(--size-4, 16px);
  min-height: 4em;
}
.gl-tab-panel { display: none; }
/* Show panel N when radio N is checked (up to 6 panels) */
.gl-disclosure-tabs > .gl-tab-input:nth-of-type(1):checked ~ .gl-tab-panels > .gl-tab-panel:nth-child(1),
.gl-disclosure-tabs > .gl-tab-input:nth-of-type(2):checked ~ .gl-tab-panels > .gl-tab-panel:nth-child(2),
.gl-disclosure-tabs > .gl-tab-input:nth-of-type(3):checked ~ .gl-tab-panels > .gl-tab-panel:nth-child(3),
.gl-disclosure-tabs > .gl-tab-input:nth-of-type(4):checked ~ .gl-tab-panels > .gl-tab-panel:nth-child(4),
.gl-disclosure-tabs > .gl-tab-input:nth-of-type(5):checked ~ .gl-tab-panels > .gl-tab-panel:nth-child(5),
.gl-disclosure-tabs > .gl-tab-input:nth-of-type(6):checked ~ .gl-tab-panels > .gl-tab-panel:nth-child(6) {
  display: block;
}
.gl-disclosure-tabs > .gl-tab-input:nth-of-type(1):checked ~ .gl-tab-list > .gl-tab:nth-child(1),
.gl-disclosure-tabs > .gl-tab-input:nth-of-type(2):checked ~ .gl-tab-list > .gl-tab:nth-child(2),
.gl-disclosure-tabs > .gl-tab-input:nth-of-type(3):checked ~ .gl-tab-list > .gl-tab:nth-child(3),
.gl-disclosure-tabs > .gl-tab-input:nth-of-type(4):checked ~ .gl-tab-list > .gl-tab:nth-child(4),
.gl-disclosure-tabs > .gl-tab-input:nth-of-type(5):checked ~ .gl-tab-list > .gl-tab:nth-child(5),
.gl-disclosure-tabs > .gl-tab-input:nth-of-type(6):checked ~ .gl-tab-list > .gl-tab:nth-child(6) {
  color: var(--color-primary, var(--navy));
  border-color: var(--color-panel-border, var(--panel-border));
  border-bottom-color: var(--color-surface, #fff);
  background: var(--color-surface, #fff);
}

/* ---- Heatmap + waterfall (in-repo painters; pack CSS parity) ---- */
