name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          playwright install --with-deps chromium

      # The layout catalog is generated from dispatch.LAYOUT_RECIPES. If a layout
      # is added or rewired without regenerating, this fails -- which is the whole
      # point of the gate. Fix with: python scripts/gen_layout_index.py
      - name: Layout index is current
        run: python scripts/gen_layout_index.py --check

      # renderer_v3 JSON Schema is generated from typed models (D121). Drift means
      # the committed artifact was not regenerated after a model change.
      - name: renderer_v3 handoff schema is current
        run: python -m impact_slides.renderer_v3.schema_export --check

      # The renderer must not reach outside the repo for a chart pack. A machine-local
      # soft-import previously made heatmap/waterfall render empty everywhere but one
      # dev box, and the suite stayed green (see PR #127). Cheap guard against relapse.
      - name: No machine-local paths in renderer_v2
        run: |
          if grep -rn 'Path\.home()' impact_slides/renderer_v2/; then
            echo "::error::renderer_v2 must not reference Path.home()"
            exit 1
          fi

      - name: No machine-local paths in renderer_v3
        run: |
          if grep -rn 'Path\.home()' impact_slides/renderer_v3/; then
            echo "::error::renderer_v3 must not reference Path.home()"
            exit 1
          fi

      - name: Tests
        run: python -m pytest -q
